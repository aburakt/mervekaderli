# ORTAK (core): template'ten gelir, sitede elle değiştirilmez (bun run core:sync).
# Template'teki ortak dosyalar değişince sitede `bun run core:sync` çalıştırıp PR açar; CI o PR'da koşar, birleştirmek insana kalır.
# Repo sırrı gerekir: CORE_SYNC_TOKEN (fine-grained PAT; template ve bu site için Contents, Pull requests, Workflows: read/write).
# GITHUB_TOKEN yetmez: template private, workflow dosyalarını güncelleyemez ve açtığı PR CI'ı tetiklemez.
name: core-sync

on:
  schedule:
    - cron: "0 6 * * 1" # pazartesi 09:00 (TR)
  workflow_dispatch:
    inputs:
      ref:
        description: "Template etiketi ya da dalı"
        default: "main"

permissions:
  contents: read

concurrency: core-sync

jobs:
  sync:
    if: github.repository != 'aburakt/astro-pb-template'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.CORE_SYNC_TOKEN }}
      REF: ${{ inputs.ref || 'main' }}
      BRANCH: core-sync
      BASE: ${{ github.event.repository.default_branch }}
    steps:
      - name: Sır var mı
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::CORE_SYNC_TOKEN repo sırrı yok (Settings → Secrets and variables → Actions)"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.CORE_SYNC_TOKEN }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Template'ten core'u al
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          bun scripts/core-sync.ts "$REF"
      - name: Değişiklik varsa PR aç
        run: |
          # Yalnız kilitteki template commit'i değiştiyse (core dosyaları aynı) PR açılmaz.
          if [ -z "$(git status --porcelain -- . ':!core.lock')" ]; then echo "core güncel"; exit 0; fi
          commit=$(jq -r .commit core.lock | cut -c1-7)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -q -m "Core güncellemesi: template $commit"
          git push -f origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number -q '.[].number')" ]; then
            gh pr create --base "$BASE" --head "$BRANCH" --title "Core güncellemesi (template $commit)" --body "$(printf '%s\n\n%s\n\n%s' \
              "Template'teki ortak dosyalar değişti; \`bun run core:sync\` ile alındı (template $commit)." \
              "Değişiklikler: https://github.com/aburakt/astro-pb-template/commits/main" \
              "Birleştirmeden önce CI yeşil olmalı. pb/pb_hooks değiştiyse sunucuda o PB'nin pb_hooks klasörü de güncellenir.")"
          fi
